services:
  webapi:
    build:
      context: .
      dockerfile: DeepResearchAgent.WebAPI/Dockerfile
    container_name: deepresearchagent-webapi
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Qdrant__BaseUrl: http://host.docker.internal:6333/
      Nvidia__ApiKey: "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"
      Nvidia__EmbeddingModel: "nvidia/llama-nemotron-embed-vl-1b-v2"
      Tavily__ApiKey: "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"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: DeepResearchAgent.Worker/Dockerfile
    container_name: deepresearchagent-worker
    environment:
      DOTNET_ENVIRONMENT: Production
      Qdrant__BaseUrl: http://host.docker.internal:6333/
      Nvidia__ApiKey: "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"
      Nvidia__EmbeddingModel: "nvidia/llama-nemotron-embed-vl-1b-v2"
      Nvidia__ChatModel: "nvidia/nemotron-3-super-120b-a12b"
      Tavily__ApiKey: "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"
      ConnectionStrings__DefaultConnection: "Server=.\\SQLEXPRESS;Database=DeepResearchAgentDb;Trusted_Connection=True;TrustServerCertificate=True;"
    restart: unless-stopped